<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>스타듀 똥밸리</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="game" aria-label="스타듀 똥밸리 게임 화면"></canvas>
  <div id="touch" hidden>
    <div class="dpad">
      <button type="button" data-act="up" aria-label="위">▲</button>
      <button type="button" data-act="left" aria-label="왼쪽">◀</button>
      <button type="button" data-act="right" aria-label="오른쪽">▶</button>
      <button type="button" data-act="down" aria-label="아래">▼</button>
    </div>
    <div class="acts">
      <button type="button" class="act use" data-act="use">도구</button>
      <button type="button" class="act do" data-act="action">행동</button>
      <button type="button" class="act menu" data-act="menu">메뉴</button>
    </div>
  </div>
</div>
<!-- 엔진 코어 (순서 중요) -->
<script src="js/core/base.js"></script>
<script src="js/core/gfx.js"></script>
<script src="js/core/audio.js"></script>
<script src="js/core/items.js"></script>
<script src="js/core/item_art.js"></script>
<script src="js/core/crop_art.js"></script>
<script src="js/core/crops.js"></script>
<script src="js/core/tiles.js"></script>
<script src="js/core/world_art.js"></script>
<script src="js/core/world.js"></script>
<script src="js/core/objects.js"></script>
<script src="js/core/farming.js"></script>
<script src="js/core/farmer.js"></script>
<script src="js/core/fx.js"></script>
<script src="js/core/render.js"></script>
<script src="js/core/input.js"></script>
<script src="js/core/skills.js"></script>
<script src="js/core/time.js"></script>
<script src="js/core/player.js"></script>
<script src="js/core/maps.js"></script>
<script src="js/core/save.js"></script>
<script src="js/core/ui.js"></script>
<script src="js/core/ui_hud.js"></script>
<script src="js/core/ui_menus.js"></script>
<script src="js/core/ui_title.js"></script>
<script src="js/core/debug.js"></script>
<script src="js/core/main.js"></script>
<!-- 모듈 (각 모듈은 자기 파일만 수정) -->
<script src="js/mods/fishing.js"></script>
<script src="js/mods/mines.js"></script>
<script src="js/mods/town.js"></script>
<script src="js/mods/crafting.js"></script>
<script src="js/mods/animals.js"></script>
<script src="js/mods/home.js"></script>
<script src="js/mods/ambient.js"></script>
<!-- 시작 -->
<script src="js/core/boot.js"></script>
</body>
</html>
